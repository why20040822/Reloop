name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # playwright 浏览器无需安装(auto_login 为延迟导入, 单测不触发)
        run: pip install -r requirements.txt pytest
      - name: Run backend tests
        env:
          BRAINX_DATABASE_URL: "sqlite:///./ci_test.db"
          BRAINX_LLM_API_KEY: ""
          BRAINX_AUTH_REQUIRE_TOKEN: "false"
          BRAINX_AUTH_SESSION_SECRET: "ci-secret"
          BRAINX_SYNC_MIN_INTERVAL_SECONDS: "0"
        run: pytest tests/ test_match_score.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check:web
      - name: Run frontend tests
        run: npm run test:web
      - name: Build
        run: npm run build:web

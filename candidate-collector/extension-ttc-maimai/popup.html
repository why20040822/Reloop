<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body{width:300px;padding:16px;font:14px/1.5 system-ui;background:#f7f4ed;color:#172026}
    h2{margin:0 0 8px}.note{font-size:12px;color:#6d746f;margin:9px 0}
    #status{margin-top:10px;padding:10px;border-radius:8px;background:#ece8de;min-height:40px}
    #last{margin-top:10px;padding:10px;border-radius:8px;background:#e6f0eb;font-size:12px}
    .ok{color:#0d6f63;font-weight:700}button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px;background:#172026;color:#fff;cursor:pointer}button:disabled{opacity:.5}
  </style>
</head>
<body>
  <h2>TTC 候选人收藏器</h2>
  <div class="note">TTC / 脉脉详情页会自动导入。优先写 Otto1，占用时写 Otto2；PDF 原件优先。</div>
  <div id="status">状态正常</div>
  <div id="last">暂无最近导入记录</div>
  <button id="diagnose" type="button">检查本地服务</button>
  <button id="reload" type="button">重载扩展后台</button>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ot小插件</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; }
    body { display: flex; flex-direction: column; }
    details.status {
      flex: 0 0 auto;
      border-bottom: 1px solid #e7e7ea;
      background: #fafafa;
    }
    details.status summary {
      padding: 8px 14px;
      font: 600 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #18181b;
      cursor: pointer;
      user-select: none;
    }
    iframe.status-frame { display: block; width: 100%; height: 360px; border: 0; }
    iframe.match-frame { display: block; flex: 1 1 auto; width: 100%; min-height: 420px; border: 0; }
  </style>
</head>
<body>
  <details class="status">
    <summary>自动入库状态（点击展开/收起）</summary>
    <iframe class="status-frame" src="popup.html" title="自动入库状态"></iframe>
  </details>
  <iframe class="match-frame" src="sidepanel.html" title="候选人匹配"></iframe>
</body>
</html>
